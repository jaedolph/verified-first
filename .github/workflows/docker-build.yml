
name: Build and push Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: "{{defaultContext}}:ebs"
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: jaedolph/verifiedfirst:${{github.ref_name }},jaedolph/verifiedfirst:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'jaedolph/verifiedfirst:${{github.ref_name}}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy_test:
    name: Deploy latest image to verifiedfirst-test
    runs-on: [self-hosted, verifiedfirst-test]
    needs: push_to_registry
    steps:
      - name: Pull, migrate and restart verifiedfirst-test
        shell: bash
        run: |
          podman pull docker.io/jaedolph/verifiedfirst:latest
          # migrate with the new image before restarting, so the new code never runs against the
          # old schema. The migration runs in a one-off container that shares the running
          # container's data volume and VFIRST_ settings. The migration scripts are idempotent,
          # so they are safe to run on every deploy
          env_vars=$(podman container inspect verifiedfirst-test \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^VFIRST_')
          for migration in migrate_user_ids migrate_profile_images; do
            podman run --rm \
              --volumes-from verifiedfirst-test \
              --env-file <(printf '%s\n' "$env_vars") \
              docker.io/jaedolph/verifiedfirst:latest \
              python -m "scripts.$migration"
          done
          XDG_RUNTIME_DIR=/run/user/2001 systemctl --user restart container-verifiedfirst-test.service
