name: Run tox tests

on:
  push:
    branches: [ "main" ]
    paths:
    - "ebs/**"
  pull_request:
    branches: [ "main" ]
    paths:
    - "ebs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Get Python version from container image
      id: python
      run: echo "version=$(sed -nE 's|^FROM .*/python:([0-9]+\.[0-9]+).*|\1|p' ebs/Dockerfile)" >> "$GITHUB_OUTPUT"
    - name: Set up Python ${{ steps.python.outputs.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.python.outputs.version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox -c ebs/tox.ini
